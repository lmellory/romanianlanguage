<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vorbește">
<title>Vorbește · Румынский A1→C2</title>
<link id="manifest" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#06070d; --bg2:#0a0d18; --panel:#0e1322; --panel2:#121a2e;
  --line:#1d2742; --line2:#2a3a63;
  --cy:#22d3ee; --cy-d:#0891b2; --mg:#f43f9d; --pp:#a855f7; --lm:#a3e635; --gd:#fbbf24;
  --tx:#dce6f7; --tx2:#8aa0c6; --tx3:#5b6f96;
  --good:#34d399; --bad:#fb5d6a;
  --glow-cy:0 0 18px rgba(34,211,238,.45); --glow-mg:0 0 18px rgba(244,63,157,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);font-family:"Exo 2",system-ui,sans-serif;font-size:16px;line-height:1.5;
  background-image:
    radial-gradient(900px 500px at 80% -10%, rgba(168,85,247,.10), transparent),
    radial-gradient(800px 500px at -10% 10%, rgba(34,211,238,.10), transparent),
    linear-gradient(rgba(34,211,238,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.035) 1px, transparent 1px);
  background-size:auto,auto,38px 38px,38px 38px;
  min-height:100vh;padding-bottom:88px;
}
.mono{font-family:"JetBrains Mono",monospace}
h1,h2,h3{font-weight:800;letter-spacing:.4px;margin:0;line-height:1.15}
.neon{color:var(--cy);text-shadow:var(--glow-cy)}
.neon-mg{color:var(--mg);text-shadow:var(--glow-mg)}
.ro{font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 0}
.hdr{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:rgba(6,7,13,.78);border-bottom:1px solid var(--line)}
.hdr-in{max-width:760px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:19px;letter-spacing:1px}
.brand .b{color:var(--mg);text-shadow:var(--glow-mg)}
.lvl-pill{font-family:"JetBrains Mono";font-size:11px;font-weight:700;border:1px solid var(--cy);color:var(--cy);border-radius:6px;padding:2px 7px;box-shadow:inset 0 0 10px rgba(34,211,238,.15)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mini{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;font-family:"JetBrains Mono"}
.mini .i{font-size:14px}
.gear{border:1px solid var(--line2);background:var(--panel);border-radius:9px;width:34px;height:34px;font-size:16px;display:flex;align-items:center;justify-content:center}
.xpbar{height:3px;background:var(--line);position:relative;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));box-shadow:var(--glow-cy);transition:width .5s}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(8,10,18,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;width:100%;display:flex}
.nav button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx3);font-size:10.5px;font-weight:700;position:relative}
.nav button .ic{font-size:21px;line-height:1;filter:grayscale(.4);transition:.15s}
.nav button.on{color:var(--cy)}
.nav button.on .ic{filter:none;transform:translateY(-1px);text-shadow:var(--glow-cy)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--cy);box-shadow:var(--glow-cy);border-radius:2px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;position:relative}
.card.glow{border-color:var(--line2);box-shadow:0 0 0 1px rgba(34,211,238,.06),0 14px 40px -22px rgba(34,211,238,.4)}
.card .corner{position:absolute;top:0;right:0;width:34px;height:34px;border-top:2px solid var(--cy);border-right:2px solid var(--cy);border-top-right-radius:16px;opacity:.5}
.eyebrow{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);font-weight:500}
.sub{color:var(--tx2);font-size:14px}
.row{display:flex;gap:10px}.between{justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;border:1px solid var(--cy-d);background:linear-gradient(180deg,rgba(34,211,238,.18),rgba(34,211,238,.06));color:#bdf3fc;border-radius:12px;padding:13px 18px;transition:.15s;text-shadow:0 0 8px rgba(34,211,238,.4)}
.btn:hover{box-shadow:var(--glow-cy);border-color:var(--cy)}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.mg{border-color:#9d2766;background:linear-gradient(180deg,rgba(244,63,157,.2),rgba(244,63,157,.06));color:#ffc9e4;text-shadow:0 0 8px rgba(244,63,157,.4)}
.btn.mg:hover{box-shadow:var(--glow-mg);border-color:var(--mg)}
.btn.pp{border-color:#7c3aed;background:linear-gradient(180deg,rgba(168,85,247,.2),rgba(168,85,247,.06));color:#e3ccff}
.btn.gd{border-color:#b8860b;background:linear-gradient(180deg,rgba(251,191,36,.2),rgba(251,191,36,.06));color:#ffe9a8;text-shadow:0 0 8px rgba(251,191,36,.4)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--tx2);text-shadow:none}
.btn.ghost:hover{border-color:var(--cy);color:var(--cy);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.stat .n{font-family:"JetBrains Mono";font-weight:700;font-size:24px;line-height:1}
.stat .l{font-size:11px;color:var(--tx3);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
.quest{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.quest .qi{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--panel2);border:1px solid var(--line2)}
.quest .qm{flex:1;min-width:0}
.quest .qt{font-weight:700;font-size:14px}
.quest .qbar{height:5px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lm),var(--cy));border-radius:9px;transition:.3s}
.quest .qx{font-family:"JetBrains Mono";font-size:12px;color:var(--gd);font-weight:700;flex:none}
.quest.done .qt{color:var(--good);text-decoration:line-through;opacity:.7}
.quest.done .qx{color:var(--good)}
.timer-d{font-family:"JetBrains Mono";font-weight:700;font-size:46px;letter-spacing:2px;text-align:center;color:var(--cy);text-shadow:var(--glow-cy)}
.timer-d.run{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.6}}
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;color:var(--tx2);font-weight:700;font-size:13px;padding:9px 4px;border-radius:8px}
.seg button.on{background:linear-gradient(180deg,rgba(34,211,238,.2),rgba(34,211,238,.05));color:var(--cy);box-shadow:inset 0 0 12px rgba(34,211,238,.12)}
.q-prompt{font-size:clamp(22px,6vw,30px);font-weight:700;text-align:center;margin:10px 0}
.q-prompt .accent{color:var(--mg);text-shadow:var(--glow-mg)}
.q-tag{text-align:center;font-family:"JetBrains Mono";font-size:12px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase}
.tin{width:100%;font-family:"Exo 2";font-size:21px;font-weight:600;text-align:center;padding:13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx)}
.tin:focus{outline:none;border-color:var(--cy);box-shadow:var(--glow-cy)}
.tin.ok{border-color:var(--good);box-shadow:0 0 14px rgba(52,211,153,.35)}
.tin.no{border-color:var(--bad);box-shadow:0 0 14px rgba(251,93,106,.35)}
.dia{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.dia button{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 11px;font-weight:700;font-size:17px;color:var(--cy)}
.dia button:hover{border-color:var(--cy)}
.opt{width:100%;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:13px 15px;font-weight:600;font-size:16px;margin-bottom:9px;display:flex;align-items:center;gap:10px;transition:.12s}
.opt:hover{border-color:var(--cy)}
.opt.ok{border-color:var(--good);background:rgba(52,211,153,.12);color:var(--good)}
.opt.no{border-color:var(--bad);background:rgba(251,93,106,.12);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 15px;margin-top:12px;font-weight:700;border:1px solid var(--line2)}
.fb.ok{border-color:var(--good);background:rgba(52,211,153,.1);color:var(--good)}
.fb.no{border-color:var(--bad);background:rgba(251,93,106,.1);color:#ffb3ba}
.fb .ans{color:#fff}.fb small{display:block;font-weight:500;color:var(--tx2);margin-top:3px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:9px 13px;font-weight:600;font-size:16px}
.chip:hover{border-color:var(--cy)}
.ans-area{min-height:54px;border:1px dashed var(--line2);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg2);margin-bottom:12px}
.ans-area .chip{border-color:var(--cy-d);color:var(--cy)}
.ans-area:empty::before{content:"тапай слова ниже…";color:var(--tx3);font-size:14px;font-weight:500}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade button{border-radius:11px;padding:12px 4px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:var(--panel)}
.grade .g0{border-color:#7f1d2b;color:#fb7185}
.grade .g3{border-color:#854d0e;color:var(--gd)}
.grade .g4{border-color:#155e52;color:var(--good)}
.grade .g5{border-color:var(--cy-d);color:var(--cy)}
.grade small{display:block;font-family:"JetBrains Mono";font-size:9.5px;font-weight:500;color:var(--tx3);margin-top:2px}
.spk{border:1px solid var(--line2);background:var(--panel);border-radius:50%;width:36px;height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.spk:hover{border-color:var(--cy);color:var(--cy);box-shadow:var(--glow-cy)}
.reader p{margin:0 0 12px;font-size:17px;line-height:1.85}
.reader .w{cursor:pointer;border-radius:4px;padding:0 1px}
.reader .w:hover,.reader .w.act{background:rgba(34,211,238,.18);color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(110%);transition:transform .25s;background:linear-gradient(180deg,var(--panel2),var(--bg2));border-top:1px solid var(--cy);box-shadow:0 -10px 40px rgba(34,211,238,.18);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .h{display:flex;align-items:center;gap:12px}
.sheet .word{font-weight:800;font-size:26px;color:var(--mg);text-shadow:var(--glow-mg)}
.sheet .tr{color:var(--tx);font-size:18px;margin-top:2px}
.sheet .x{margin-left:auto;border:none;background:none;font-size:24px;color:var(--tx3)}
.tprog{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--mg),var(--cy));transition:.3s}
.tag{display:inline-block;font-family:"JetBrains Mono";font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--tx2)}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel)}
.list-item:hover{border-color:var(--line2)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(3,4,8,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{max-width:460px;width:100%;max-height:86vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:18px;padding:18px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);z-index:90;background:#0b1120;border:1px solid var(--cy);color:var(--cy);font-weight:700;padding:11px 18px;border-radius:12px;box-shadow:var(--glow-cy);opacity:0;pointer-events:none;transition:.3s;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
a{color:var(--cy)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <div class="brand">Vorbe<span class="b">ște</span></div>
    <span class="lvl-pill" id="lvlPill">A1</span>
    <div class="hdr-right">
      <span class="mini" title="Стрик"><span class="i">🔥</span><span id="hStreak">0</span></span>
      <span class="mini" title="Опыт"><span class="i">⚡</span><span id="hXp">0</span></span>
      <button class="gear" id="gearBtn" aria-label="Настройки">⚙️</button>
    </div>
  </div>
  <div class="xpbar"><i id="xpFill"></i></div>
</header>
<main id="app" class="wrap"></main>
<nav class="nav"><div class="nav-in" id="nav">
  <button data-v="home" class="on"><span class="ic">🏠</span>Дом</button>
  <button data-v="practice"><span class="ic">🎯</span>Практика</button>
  <button data-v="deck"><span class="ic">🧠</span>Слова</button>
  <button data-v="read"><span class="ic">📖</span>Чтение</button>
  <button data-v="oath"><span class="ic">🛡️</span>Присяга</button>
</div></nav>
<div class="sheet" id="sheet">
  <div class="h">
    <div><div class="word ro" id="shWord"></div><div class="tr" id="shTr"></div></div>
    <button class="x" id="shClose">✕</button>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn sm" id="shSpeak">🔊 Произнести</button>
    <button class="btn mg sm" id="shAdd">➕ В словарь Anki</button>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ====== ДАННЫЕ: ГЛАГОЛЫ (шаблоны спряжения) ======
   V(инф, перевод, причастие, "наст. 6 форм |", конъюнктив-3л, [полный конъюнктив])
   Лица: eu|tu|el/ea|noi|voi|ei/ele */
function V(inf,tr,part,pr,c3,cf){return{inf,tr,part,pr:pr.split('|'),c3,cf:cf?cf.split('|'):null};}
const VERBS=[
V("a fi","быть","fost","sunt|ești|este|suntem|sunteți|sunt","fie","fiu|fii|fie|fim|fiți|fie"),
V("a avea","иметь","avut","am|ai|are|avem|aveți|au","aibă"),
V("a face","делать","făcut","fac|faci|face|facem|faceți|fac","facă"),
V("a merge","идти","mers","merg|mergi|merge|mergem|mergeți|merg","meargă"),
V("a vrea","хотеть","vrut","vreau|vrei|vrea|vrem|vreți|vor","vrea"),
V("a putea","мочь","putut","pot|poți|poate|putem|puteți|pot","poată"),
V("a ști","знать","știut","știu|știi|știe|știm|știți|știu","știe"),
V("a veni","приходить","venit","vin|vii|vine|venim|veniți|vin","vină"),
V("a vedea","видеть","văzut","văd|vezi|vede|vedem|vedeți|văd","vadă"),
V("a da","давать","dat","dau|dai|dă|dăm|dați|dau","dea"),
V("a sta","находиться","stat","stau|stai|stă|stăm|stați|stau","stea"),
V("a lua","брать","luat","iau|iei|ia|luăm|luați|iau","ia"),
V("a bea","пить","băut","beau|bei|bea|bem|beți|beau","bea"),
V("a mânca","есть (кушать)","mâncat","mănânc|mănânci|mănâncă|mâncăm|mâncați|mănâncă","mănânce"),
V("a spune","сказать","spus","spun|spui|spune|spunem|spuneți|spun","spună"),
V("a zice","говорить","zis","zic|zici|zice|zicem|ziceți|zic","zică"),
V("a pune","класть","pus","pun|pui|pune|punem|puneți|pun","pună"),
V("a ține","держать","ținut","țin|ții|ține|ținem|țineți|țin","țină"),
V("a scrie","писать","scris","scriu|scrii|scrie|scriem|scrieți|scriu","scrie"),
V("a citi","читать","citit","citesc|citești|citește|citim|citiți|citesc","citească"),
V("a dormi","спать","dormit","dorm|dormi|doarme|dormim|dormiți|dorm","doarmă"),
V("a vorbi","говорить","vorbit","vorbesc|vorbești|vorbește|vorbim|vorbiți|vorbesc","vorbească"),
V("a lucra","работать","lucrat","lucrez|lucrezi|lucrează|lucrăm|lucrați|lucrează","lucreze"),
V("a locui","проживать","locuit","locuiesc|locuiești|locuiește|locuim|locuiți|locuiesc","locuiască"),
V("a învăța","учить(ся)","învățat","învăț|înveți|învață|învățăm|învățați|învață","învețe"),
V("a iubi","любить","iubit","iubesc|iubești|iubește|iubim|iubiți|iubesc","iubească"),
V("a cânta","петь","cântat","cânt|cânți|cântă|cântăm|cântați|cântă","cânte"),
V("a juca","играть","jucat","joc|joci|joacă|jucăm|jucați|joacă","joace"),
V("a pleca","уезжать","plecat","plec|pleci|pleacă|plecăm|plecați|pleacă","plece"),
V("a ajunge","достигать","ajuns","ajung|ajungi|ajunge|ajungem|ajungeți|ajung","ajungă"),
V("a începe","начинать","început","încep|începi|începe|începem|începeți|încep","înceapă"),
V("a termina","заканчивать","terminat","termin|termini|termină|terminăm|terminați|termină","termine"),
V("a aștepta","ждать","așteptat","aștept|aștepți|așteaptă|așteptăm|așteptați|așteaptă","aștepte"),
V("a găsi","находить","găsit","găsesc|găsești|găsește|găsim|găsiți|găsesc","găsească"),
V("a pierde","терять","pierdut","pierd|pierzi|pierde|pierdem|pierdeți|pierd","piardă"),
V("a uita","забывать","uitat","uit|uiți|uită|uităm|uitați|uită","uite"),
V("a cumpăra","покупать","cumpărat","cumpăr|cumperi|cumpără|cumpărăm|cumpărați|cumpără","cumpere"),

function sm2(card,q){
  if(q<3){card.reps=0;card.interval=1;card.lapses=(card.lapses||0)+1;}
  else{ if(card.reps===0)card.interval=1; else if(card.reps===1)card.interval=6; else card.interval=Math.round(card.interval*card.ef); card.reps+=1; }
  card.ef=card.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)); if(card.ef<1.3)card.ef=1.3;
  card.due=Date.now()+card.interval*864e5; return card;
}

function speak(text){if(!SPEAK_OK||!text)return;const u=new SpeechSynthesisUtterance(text);u.lang="ro-RO";u.rate=.92;
  const v=VOICES.find(x=>x.lang&&x.lang.toLowerCase().startsWith("ro"));if(v)u.voice=v;

function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type="sine";o.frequency.value=660;g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);
  o.start();o.stop(a.currentTime+.5);}catch(e){}}

function norm(s){return s.trim().toLowerCase().replace(/\s+/g," ");}
function stripD(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[șş]/g,"s").replace(/[țţ]/g,"t").replace(/[ăâ]/g,"a").replace(/î/g,"i");}
function accepts(ans){let arr=Array.isArray(ans)?ans:String(ans).split("/");let out=[];
  arr.forEach(a=>{a=a.trim();out.push(a);if(/^a\s/i.test(a))out.push(a.replace(/^a\s/i,""));});return out;}
function checkText(inp,ans){const L=accepts(ans).map(norm),i=norm(inp);
  if(L.includes(i))return"ok";if(L.map(stripD).includes(stripD(i)))return"almost";return"no";}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a){return a[Math.random()*a.length|0];}

const PRON=["eu","tu","el/ea","noi","voi","ei/ele"];
const AUX_PC=["am","ai","a","am","ați","au"];
const AUX_V=["voi","vei","va","vom","veți","vor"];
const TENSES=["Prezent","Perfect compus","Conjunctiv","Viitor"];
function conjugate(v,tense,p){
  if(tense==="Prezent")return v.pr[p];
  if(tense==="Perfect compus")return AUX_PC[p]+" "+v.part;
  if(tense==="Viitor")return AUX_V[p]+" "+v.inf.replace(/^a /,"");
  if(tense==="Conjunctiv"){let f=v.cf?v.cf[p]:((p===2||p===5)?v.c3:v.pr[p]);return "să "+f;}
}

  sentState={correct:s.ro.replace(/\.$/,""),tr:s.ru,pool:shuffle(words.map(w=>({w:w}))),ans:[]};
  drawSent();
}
function drawSent(){
  const st=sentState;
  document.getElementById("pBody").innerHTML='<div class="card glow"><div class="q-tag">Собери предложение</div>'+
   '<div class="q-prompt" style="font-size:20px;color:var(--tx)">'+esc(st.tr)+'</div>'+
   '<div class="ans-area" id="ansArea"></div><div class="chips" id="poolArea"></div>'+
   '<button class="btn block" style="margin-top:14px" id="sChk">Проверить</button><div id="sFb"></div></div>';
  const ansA=document.getElementById("ansArea"),poolA=document.getElementById("poolArea");
  st.ans.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t.w;
    b.onclick=()=>{st.ans=st.ans.filter(x=>x!==t);st.pool.push(t);drawSent();};ansA.appendChild(b);});
  st.pool.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t.w;
    b.onclick=()=>{st.pool=st.pool.filter(x=>x!==t);st.ans.push(t);drawSent();};poolA.appendChild(b);});
  document.getElementById("sChk").onclick=checkSent;
}
function checkSent(){
  const st=sentState,made=st.ans.map(t=>t.w).join(" ");
  const ok=norm(made)===norm(st.correct)||stripD(norm(made))===stripD(norm(st.correct));
  if(ok){addXP(8);S.stats.sent++;quest("sent",1);save();speak(st.correct);}
  document.getElementById("sFb").innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"Верно! 🎉":"Правильный порядок:")+' <span class="ans">'+esc(st.correct)+'.</span></div>'+
   '<div class="row" style="margin-top:10px">'+spk(st.correct)+'<button class="btn mg block" onclick="newSent()">Следующее →</button></div>';
}

    if(!m)return esc(tok);
    return esc(m[1])+'<span class="w" onclick="tapWord(this,\''+esc(m[2]).replace(/'/g,"\\'")+'\')">'+esc(m[2])+'</span>'+esc(m[3]);
  }).join(" ");

var testState=null;
function startTest(){testState={q:0,total:20,di:1,used:[],perLvl:{},correct:0};LV.forEach(l=>testState.perLvl[l]={c:0,t:0});nextTestQ();}
function pickQ(di){
  var order=[di];for(var d=1;d<LV.length;d++){if(di-d>=0)order.push(di-d);if(di+d<LV.length)order.push(di+d);}
  for(var k=0;k<order.length;k++){var lv=LV[order[k]];var cand=[];for(var i=0;i<QUIZ.length;i++)if(QUIZ[i].lvl===lv&&testState.used.indexOf(i)<0)cand.push(i);if(cand.length)return rnd(cand);}
  return Math.random()*QUIZ.length|0;
}
function nextTestQ(){
  if(testState.q>=testState.total){finishTest();return;}
  var idx=pickQ(testState.di);testState.used.push(idx);var item=QUIZ[idx];
  var opts=shuffle(item.o.map(function(o,i){return{o:o,correct:i===item.a};}));
  var pct=Math.round(testState.q/testState.total*100);
  var oh="";opts.forEach(function(o){oh+='<button class="opt" data-c="'+(o.correct?1:0)+'">'+esc(o.o)+'</button>';});
  openModal('<div class="row between"><div class="eyebrow">Тест уровня · '+(testState.q+1)+'/'+testState.total+'</div><span class="tag">'+item.lvl+'</span></div>'+
   '<div class="tprog" style="margin-top:10px"><i style="width:'+pct+'%"></i></div><div class="q-prompt" style="font-size:20px">'+esc(item.q)+'</div><div id="testOpts">'+oh+'</div>');
  var btns=document.querySelectorAll("#testOpts .opt");
  btns.forEach(function(b){b.onclick=function(){answerTest(b,item);};});
}
function answerTest(b,item){
  var correct=b.dataset.c==="1";
  document.querySelectorAll("#testOpts .opt").forEach(function(x){x.disabled=true;if(x.dataset.c==="1")x.classList.add("ok");});
  if(!correct)b.classList.add("no");
  testState.perLvl[item.lvl].t++;
  if(correct){testState.perLvl[item.lvl].c++;testState.correct++;testState.di=Math.min(LV.length-1,testState.di+1);}
  else testState.di=Math.max(0,testState.di-1);
  testState.q++;setTimeout(nextTestQ,correct?500:1050);
}
function finishTest(){
  var lvl="A1";
  for(var i=0;i<LV.length;i++){var p=testState.perLvl[LV[i]];if(p.t>=2&&p.c/p.t>=0.6)lvl=LV[i];}
  S.level=lvl;S.quests=genQuests();save();
  openModal('<div style="text-align:center"><div style="font-size:54px">🎯</div><div class="eyebrow">Результат</div>'+
   '<h2 style="font-size:40px;margin:6px 0" class="neon-mg">'+lvl+'</h2>'+
   '<p class="sub">Верных ответов: '+testState.correct+'/'+testState.total+'. Контент и квесты настроены под твой уровень.</p>'+
   '<button class="btn block" style="margin-top:16px" onclick="closeModal();go(\'home\')">Начать обучение →</button></div>');
}

function exportData(){var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="vorbeste-progres-"+todayStr()+".json";a.click();toast("Прогресс экспортирован");}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(typeof d.xp!=="number"||!d.deck)throw 0;S=d;mem=d;save();toast("Прогресс восстановлен");closeModal();render();}catch(_){toast("Файл не распознан");}};r.readAsText(f);}
function resetAll(){if(confirm("Сбросить весь прогресс безвозвратно?")){S=fresh();mem=S;save();toast("Сброшено");closeModal();go("home");}}

try{document.getElementById("manifest").setAttribute("href",URL.createObjectURL(new Blob([JSON.stringify(MANIFEST)],{type:"application/json"})));}catch(e){}
var deferredPrompt=null;

function installPrompt(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else toast("Установка: меню браузера → «На главный экран». Для офлайна нужен хостинг (https).");}
var SW="const C='vorbeste-v1';self.addEventListener('install',function(e){self.skipWaiting();});self.addEventListener('activate',function(e){self.clients.claim();});self.addEventListener('fetch',function(e){e.respondWith(caches.open(C).then(function(c){return c.match(e.request).then(function(r){return r||fetch(e.request).then(function(res){try{c.put(e.request,res.clone());}catch(_){}return res;}).catch(function(){return r;});});}));});";
if("serviceWorker"in navigator&&(location.protocol==="https:"||location.protocol==="http:")){try{navigator.serviceWorker.register(URL.createObjectURL(new Blob([SW],{type:"text/javascript"}))).catch(function(){});}catch(e){}}
